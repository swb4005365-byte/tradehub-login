<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المنتجات - TradeHub Pro</title>
  <!-- PWA -->
  <meta name="theme-color" content="#f59e0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TradeHub Pro" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/auth.js"></script>
  <style>
    .page-layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; padding: 24px 0 40px; }
    /* Filters Sidebar */
    .filters-sidebar { background: white; border: 1px solid var(--border); border-radius: var(--radius-md); height: fit-content; position: sticky; top: 80px; }
    .filter-header { padding: 16px 20px; background: var(--secondary); color: white; border-radius: var(--radius-md) var(--radius-md) 0 0; display:flex; align-items:center; justify-content:space-between; }
    .filter-header h3 { font-size:15px; font-weight:700; }
    .filter-reset { background:none; border:none; color:rgba(255,255,255,0.6); font-size:13px; cursor:pointer; }
    .filter-reset:hover { color:var(--primary); }
    .filter-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .filter-section:last-child { border-bottom: none; }
    .filter-section h4 { font-size:13px; font-weight:700; color:var(--text-dark); margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
    .filter-option { display:flex; align-items:center; gap:8px; padding:5px 0; cursor:pointer; font-size:13px; color:var(--text-mid); }
    .filter-option input[type=checkbox] { accent-color: var(--primary); width:15px; height:15px; }
    .filter-option:hover { color:var(--primary); }
    .price-range { display:flex; align-items:center; gap:8px; margin-top:8px; }
    .price-input { width:80px; padding:6px 8px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:13px; text-align:center; outline:none; }
    .price-input:focus { border-color:var(--primary); }
    /* Products Area */
    .products-area {}
    .products-toolbar { display:flex; align-items:center; justify-content:space-between; background:white; padding:12px 16px; border-radius:var(--radius-md); margin-bottom:16px; border:1px solid var(--border); gap:12px; flex-wrap:wrap; }
    .toolbar-left { display:flex; align-items:center; gap:12px; }
    .toolbar-right { display:flex; align-items:center; gap:10px; }
    .results-count { font-size:14px; color:var(--text-mid); }
    .results-count strong { color:var(--primary); }
    .sort-select { padding:8px 12px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:13px; outline:none; cursor:pointer; background:white; }
    .sort-select:focus { border-color:var(--primary); }
    .view-btn { padding:8px 10px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:white; cursor:pointer; transition:var(--transition); color:var(--text-mid); }
    .view-btn.active { border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
    .products-grid.list-view { grid-template-columns: 1fr !important; }
    .products-grid.list-view .product-card { display:flex; }
    .products-grid.list-view .product-img-wrap { width:200px; flex-shrink:0; height:auto; }
    /* Breadcrumb */
    .breadcrumb { padding: 12px 0; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-light); }
    .breadcrumb a { color:var(--text-mid); transition:var(--transition); }
    .breadcrumb a:hover { color:var(--primary); }
    .breadcrumb span { color:var(--text-light); }
    /* Active Filters */
    .active-filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .filter-tag { display:flex; align-items:center; gap:6px; background:var(--primary-light); color:var(--primary); padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; border:1.5px solid rgba(255,107,53,0.2); }
    .filter-tag button { background:none; border:none; cursor:pointer; color:var(--primary); font-size:14px; padding:0; line-height:1; }
    /* Pagination */
    .pagination { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:32px; }
    .page-btn { width:36px; height:36px; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:white; cursor:pointer; font-size:13px; transition:var(--transition); display:flex; align-items:center; justify-content:center; color:var(--text-mid); }
    .page-btn:hover { border-color:var(--primary); color:var(--primary); }
    .page-btn.active { background:var(--primary); border-color:var(--primary); color:white; font-weight:700; }
    .page-btn:disabled { opacity:0.4; cursor:not-allowed; }
    /* Category tabs */
    .cat-tabs { display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; padding-bottom:4px; }
    .cat-tab { padding:8px 18px; border-radius:20px; border:1.5px solid var(--border); background:white; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; transition:var(--transition); color:var(--text-mid); }
    .cat-tab:hover { border-color:var(--primary); color:var(--primary); }
    .cat-tab.active { background:var(--primary); border-color:var(--primary); color:white; }
    @media (max-width:900px) { .page-layout { grid-template-columns: 1fr; } .filters-sidebar { display:none; } }
  </style>
</head>

  <!-- Breadcrumb -->

<script src="js/main.js"></script>
<script>
// === PRODUCTS PAGE ===
let allProducts = [];
let filteredProducts = [];
let currentPage = 1;
const ITEMS_PER_PAGE = 12;
let currentView = 'grid';

const params = new URLSearchParams(location.search);

async function loadAllProducts() {
  try {
    const res = await fetch('tables/products?limit=100');
    const data = await res.json();
    allProducts = data.data || [];
    allProducts.forEach(p => productsCache[p.id] = p);
    await loadCategoryTabs();
    applyFilters();
  } catch {
    document.getElementById('productsGrid').innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-exclamation-circle"></i><h3>تعذر تحميل المنتجات</h3></div>';
  }
}

async function loadCategoryTabs() {
  const res = await fetch('tables/categories?limit=20');
  const data = await res.json();
  const cats = data.data || [];
  const tabs = document.getElementById('catTabs');
  const activeCat = params.get('category') || '';
  tabs.innerHTML = `<button class="cat-tab ${!activeCat ? 'active' : ''}" data-cat="" onclick="setCategoryTab('')">الكل</button>`;
  cats.forEach(c => {
    tabs.innerHTML += `<button class="cat-tab ${activeCat === c.id ? 'active' : ''}" data-cat="${c.id}" onclick="setCategoryTab('${c.id}')">${c.name_ar || c.name}</button>`;
  });
}

function setCategoryTab(catId) {
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.cat-tab[data-cat="${catId}"]`)?.classList.add('active');
  params.set('category', catId);
  currentPage = 1;
  applyFilters();
}

function applyFilters() {
  let products = [...allProducts];

  // Search
  const searchQ = params.get('search') || document.getElementById('searchInput')?.value?.trim();
  if (searchQ) {
    const q = searchQ.toLowerCase();
    products = products.filter(p =>
      (p.name_ar || '').toLowerCase().includes(q) ||
      (p.name || '').toLowerCase().includes(q) ||
      (p.supplier || '').toLowerCase().includes(q) ||
      (p.tags || []).some(t => t.includes(q))
    );
  }

  // Category
  const catFilter = params.get('category') || document.querySelector('.cat-tab.active')?.dataset?.cat;
  if (catFilter) products = products.filter(p => p.category === catFilter);

  // Price Range
  const priceMin = parseFloat(document.getElementById('priceMin')?.value);
  const priceMax = parseFloat(document.getElementById('priceMax')?.value);
  if (!isNaN(priceMin)) products = products.filter(p => p.price_min >= priceMin);
  if (!isNaN(priceMax)) products = products.filter(p => p.price_max <= priceMax);

  // Rating
  const ratingVal = document.querySelector('input[name="rating"]:checked')?.value;
  if (ratingVal && parseFloat(ratingVal) > 0) products = products.filter(p => (p.rating || 0) >= parseFloat(ratingVal));

  // Countries
  const checkedCountries = [...document.querySelectorAll('#countryFilter input:checked')].map(i => i.value);
  if (checkedCountries.length) products = products.filter(p => checkedCountries.includes(p.supplier_country));

  // Other options
  if (document.getElementById('discountOnly')?.checked) products = products.filter(p => p.discount > 0);
  if (document.getElementById('inStockOnly')?.checked) products = products.filter(p => p.in_stock);

  // Discount filter (url param)
  if (params.get('filter') === 'bulk') products = products.filter(p => (p.min_order || 1) >= 50);

  // Sort
  const sort = document.getElementById('sortSelect')?.value;
  if (sort === 'price_asc') products.sort((a, b) => (a.price_min || 0) - (b.price_min || 0));
  else if (sort === 'price_desc') products.sort((a, b) => (b.price_min || 0) - (a.price_min || 0));
  else if (sort === 'rating') products.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  else if (sort === 'reviews') products.sort((a, b) => (b.reviews_count || 0) - (a.reviews_count || 0));

  filteredProducts = products;
  document.getElementById('resultCount').textContent = products.length;
  renderProducts();
  renderPagination();
}

function applyPriceFilter() { currentPage = 1; applyFilters(); }
function applyMinOrder(cb) {
  document.querySelectorAll('#minOrderFilter input').forEach(i => { if (i !== cb) i.checked = false; });
  applyFilters();
}

function renderProducts() {
  const grid = document.getElementById('productsGrid');
  const start = (currentPage - 1) * ITEMS_PER_PAGE;
  const items = filteredProducts.slice(start, start + ITEMS_PER_PAGE);
  if (!items.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <i class="fas fa-search"></i>
      <h3>لا توجد منتجات تطابق البحث</h3>
      <p>جرب تغيير معايير البحث أو الفلاتر</p>
      <button class="btn btn-outline" onclick="resetFilters()" style="margin-top:12px">إعادة تعيين الفلاتر</button>
    </div>`;
    return;
  }
  grid.innerHTML = items.map(buildProductCard).join('');
}

function renderPagination() {
  const total = Math.ceil(filteredProducts.length / ITEMS_PER_PAGE);
  const pg = document.getElementById('pagination');
  if (total <= 1) { pg.innerHTML = ''; return; }
  let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}><i class="fas fa-chevron-right"></i></button>`;
  for (let i = 1; i <= total; i++) {
    if (i === 1 || i === total || Math.abs(i - currentPage) <= 1) {
      html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    } else if (Math.abs(i - currentPage) === 2) {
      html += `<span style="padding:0 4px;color:var(--text-light)">...</span>`;
    }
  }
  html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}><i class="fas fa-chevron-left"></i></button>`;
  pg.innerHTML = html;
}

function goPage(n) {
  const total = Math.ceil(filteredProducts.length / ITEMS_PER_PAGE);
  if (n < 1 || n > total) return;
  currentPage = n;
  renderProducts();
  renderPagination();
  window.scrollTo({ top: 300, behavior: 'smooth' });
}

function setView(v) {
  currentView = v;
  const grid = document.getElementById('productsGrid');
  document.getElementById('gridViewBtn').classList.toggle('active', v === 'grid');
  document.getElementById('listViewBtn').classList.toggle('active', v === 'list');
  grid.classList.toggle('list-view', v === 'list');
}

function resetFilters() {
  document.querySelectorAll('.filters-sidebar input').forEach(i => {
    if (i.type === 'checkbox' || i.type === 'radio') i.checked = false;
    else i.value = '';
  });
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.cat-tab[data-cat=""]')?.classList.add('active');
  currentPage = 1;
  applyFilters();
}

function toggleFilter(el) {
  const section = el.nextElementSibling;
  if (section) {
    section.style.display = section.style.display === 'none' ? '' : 'none';
    el.querySelector('i').className = section.style.display === 'none' ? 'fas fa-chevron-down' : 'fas fa-chevron-up';
  }
}

function closeModal() {
  document.getElementById('inquiryModal')?.classList.remove('open');
}
function sendInquiry() {
  showToast('تم إرسال طلب عرض السعر بنجاح ✅', 'success');
