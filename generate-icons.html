<!DOCTYPE html>
<html>
<head><title>PWA Icon Generator</title></head>
<body>
<h3>PWA Icon Generator for TradeHub Pro</h3>
<canvas id="c" width="512" height="512"></canvas>
<script>
// This file generates icons programmatically
// Icons are embedded as data URLs in the main chatbot.js
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function drawIcon(size) {
  canvas.width = size;
  canvas.height = size;
  const r = size * 0.156; // border-radius

  // Background gradient
  const bg = ctx.createLinearGradient(0, 0, size, size);
  bg.addColorStop(0, '#0f172a');
  bg.addColorStop(1, '#1e293b');

  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = bg;
  ctx.fill();

  // Gold gradient for T
  const gold = ctx.createLinearGradient(0, 0, size, size);
  gold.addColorStop(0, '#f59e0b');
  gold.addColorStop(1, '#d97706');

  ctx.fillStyle = gold;
  ctx.font = `900 ${size * 0.6}px Arial Black, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('T', size / 2, size / 2 + size * 0.05);

  return canvas.toDataURL('image/png');
}

sizes.forEach(s => {
  const url = drawIcon(s);
  const a = document.createElement('a');
  a.href = url;
  a.download = `icon-${s}x${s}.png`;
  a.textContent = `Download ${s}x${s}`;
  document.body.appendChild(a);
  document.body.appendChild(document.createElement('br'));
});
</script>
</body>
</html>
