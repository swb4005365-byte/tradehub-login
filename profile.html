<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeHub Pro - إكمال الحساب الآمن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --success: #10b981;
            --accent: #fbbf24; 
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 20px;
        }

        .profile-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .header h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* حقول البيانات */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            margin-bottom: 25px;
        }

        .input-group {
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-right: 4px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .input-field {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 45px 14px 16px;
            color: var(--text-main);
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        /* زر الحفظ النهائي */
        .save-btn {
            width: 100%;
            background: linear-gradient(90deg, #0ea5e9, #38bdf8);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
        }

        .security-note {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="header">
            <div class="status-badge">
                <i class="fa-solid fa-shield-halved"></i>
                تم التحقق بالبصمة الحيوية بنجاح
            </div>
            <h2>مرحباً بك في TradeHub Pro</h2>
            <p>يرجى إكمال بيانات حسابك لتفعيل المنصة</p>
        </div>

        <form onsubmit="saveProfile(event)">
            <div class="form-grid">
                <div class="input-group">
                    <label for="fullName">الاسم الكامل / اسم الشركة</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="fullName" class="input-field" placeholder="أدخل الاسم الثلاثي أو الرسمي" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="phone">رقم الهاتف النشط</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="phone" class="input-field" placeholder="+966 / +962 / +964" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="location">المنطقة / المدينة</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-location-dot"></i>
                        <input type="text" id="location" class="input-field" placeholder="مثال: الرياض، عمان، بغداد" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="save-btn">
                <i class="fa-solid fa-circle-check"></i>
                تأثير وحفظ الحساب الذكي
            </button>
        </form>

        <div class="security-note">
            <i class="fa-solid fa-lock"></i>
            بياناتك مشفرة ومحمية 100% وفقاً لمعايير الأمان العالمية.
        </div>
    </div>

    <script>
        function saveProfile(event) {
            event.preventDefault();
            alert('تم حفظ البيانات بنجاح! حسابك جاهز الآن للإنطلاق في TradeHub Pro.');
        }
    </script>
</body>
</html>
